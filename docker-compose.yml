# 宿主机端口可通过 WEB_PORT 覆盖：
#   WEB_PORT=9000 docker compose up web
# 容器内固定监听 8080，仅宿主机映射端口可配置。
services:
  web:
    build: .
    image: mosaic-mesh-check:latest
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      WEB_PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

  # 一次性核验服务：跑单元测试、前端构建与业务冒烟，
  # 全部通过则以 0 退出；任何失败以非零退出码报告。
  #   docker compose run --rm verify
  verify:
    build: .
    image: mosaic-mesh-check:latest
    command: ["npm", "run", "verify"]
    restart: "no"
